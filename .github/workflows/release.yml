# Builds and publishes the Docker images of a release, when a version tag reaches the public repository
# (scripts/publish-public.sh): one image, the server (the MCP server included, at /mcp), for amd64 and arm64, on Docker Hub
# (totalbase/totalbase) and GitHub's registry. A beta is tagged `0.1.0-beta.N` and `beta`; `latest` waits for the first stable release; any other pre-release
# (a test of this workflow) only its version.
#
# Each architecture builds on its own native runner, in parallel - never emulated (QEMU took most of an hour) - and is
# pushed by digest; `merge` joins both digests under the release's version; `verify` pulls that version from Docker Hub
# on each architecture and runs scripts/test-image.sh on it; only then `channel` moves the channel tag to it, so whoever
# pulls `beta` (or `latest`) never gets an image that wasn't checked, and `release` publishes the GitHub release, its notes
# the version's section of CHANGELOG.md (scripts/release-notes.sh) (Foundations.md §21.5).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: totalbase
  REGISTRIES: totalbase ghcr.io/totalbase-io

jobs:
  build:
    # Only the public repository publishes; the development repository's tags never do.
    if: github.repository == 'totalbase-io/totalbase'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: arch
        run: echo "name=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      # The one image: the server - the Data API, the admin, the App and the MCP server at /mcp. Pushed to both
      # registries by digest only, untagged until the merge.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=totalbase/${{ env.IMAGE }},ghcr.io/totalbase-io/${{ env.IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/totalbase-io/totalbase
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ steps.arch.outputs.name }}
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.arch.outputs.name }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-platform image with its version
        working-directory: /tmp/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          for registry in $REGISTRIES; do
            docker buildx imagetools create -t "$registry/$IMAGE:$version" $(printf "$registry/$IMAGE@sha256:%s " *)
            docker buildx imagetools inspect "$registry/$IMAGE:$version"
          done
  verify:
    needs: merge
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The script's checks are a node script (fetch).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pulled by its version from Docker Hub, as people install it: each runner gets its own architecture's image.
      - name: Check the published image
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker pull "totalbase/$IMAGE:$version"
          scripts/test-image.sh "totalbase/$IMAGE:$version" "$version"
  channel:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move the channel to the checked image
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A channel only for what it names: a beta, a release candidate, a stable version. Any other pre-release
          # (a test of this workflow, 0.0.0-test.1) gets its version alone - never latest.
          case "$version" in
            *-beta.*) channel=beta ;;
            *-rc.*) channel=rc ;;
            *-*) echo "No channel for $version."; exit 0 ;;
            *) channel=latest ;;
          esac
          for registry in $REGISTRIES; do
            docker buildx imagetools create -t "$registry/$IMAGE:$channel" "$registry/$IMAGE:$version"
            docker buildx imagetools inspect "$registry/$IMAGE:$channel"
          done
  # The GitHub release, once the image is checked and announced: its notes are the version's section of CHANGELOG.md,
  # written in the release commit (scripts/release-notes.sh). A beta, a release candidate or a stable version without
  # one fails the run, so the docs and website deploys, which wait for it, refuse too; a test of this workflow gets none.
  release:
    needs: channel
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-beta.*|*-rc.*) kind=--prerelease ;;
            *-*) echo "No release for $version."; exit 0 ;;
            *) kind=--latest ;;
          esac
          scripts/release-notes.sh "$version" > /tmp/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "TotalBase $version" --notes-file /tmp/notes.md --draft=false $kind
          else
            gh release create "$GITHUB_REF_NAME" --title "TotalBase $version" --notes-file /tmp/notes.md --verify-tag $kind
          fi
